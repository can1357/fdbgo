name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        shell: bash
        run: |
          files=$(git ls-files '*.go' | xargs gofmt -l)
          if [[ -n "$files" ]]; then
            printf 'Unformatted Go files:\n%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 -timeout=5m ./...

  integration:
    name: FoundationDB ${{ matrix.fdb }} (Linux amd64)
    strategy:
      fail-fast: false
      matrix:
        # Exact binary checksums, source commits, API versions and adjacent
        # upgrade targets are centralized in scripts/fdb-releases.tsv.
        fdb:
          - '5.0.8'
          - '5.1.7'
          - '5.2.8'
          - '6.0.18'
          - '6.1.13'
          - '6.2.30'
          - '6.3.25'
          - '7.0.0'
          - '7.1.67'
          - '7.2.9'
          - '7.3.81'
          - '7.4.8'
          - '8.0.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            bench/go.sum
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.12'
      - name: Install historical reference build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libffi-dev zlib1g-dev xz-utils
      - name: Full functional, reference-binding and adjacent-upgrade checks
        shell: bash
        run: scripts/test-versions.sh '${{ matrix.fdb }}'
